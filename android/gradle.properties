# ==============================================================================
# ⚙️ GRADLE PROPERTIES — AUDITORÍA DOCTORADO EN INGENIERÍA INFORMÁTICA
# ==============================================================================
# Proyecto: Videitos App (cl.videitos.app)
# Arquitectura de compilación de alto rendimiento, optimización de memoria RAM,
# gestión de daemons y compatibilidad nativa con AndroidX.
# ==============================================================================

# ─── 1. OPTIMIZACIÓN DE MEMORIA Y RENDIMIENTO DE LA MÁQUINA VIRTUAL (JVM) ───
# Asigna 3 GB de memoria heap a Gradle y metadatos amplios para evitar el error 
# crítico de compilación "DaemonCrashedException" o OutOfMemoryError.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC

# Asigna 2 GB específicos para el demonio del compilador de Kotlin (Kotlin Daemon)
kotlin.daemon.jvmargs=-Xmx2g

# ─── 2. ACELERACIÓN Y PARALELIZACIÓN DE TAREAS ─────────────────────────────
# Activa la ejecución concurrente de tareas independientes utilizando todos los hilos del CPU
org.gradle.parallel=true

# Almacena en caché los resultados de compilaciones previas para acelerar builds incrementales
org.gradle.caching=true

# Habilita la evaluación y configuración bajo demanda de los subproyectos
org.gradle.configureondemand=true

# Reutiliza el demonio de Gradle de forma persistente para reducir tiempos muertos de inicio
org.gradle.daemon=true

# ─── 3. COMPATIBILIDAD DE ANDROID NATIVO Y JETPACK ────────────────────────
# Fuerza el uso exclusivo de AndroidX (librerías modernas de soporte y UI de Google)
android.useAndroidX=true

# Desactiva Jetifier. Al no utilizar librerías legacy obsoletas de soporte (anteriores a 2018),
# esto reduce drásticamente el tiempo de análisis de bytecode en el arranque de Gradle.
android.enableJetifier=false

# ─── 4. ESTABILIDAD DE ARQUITECTURA DE BUILD (AGP & FLUTTER) ───────────────
# Desactiva el nuevo DSL dinámico experimental para evitar conflictos de tareas duplicadas
android.newDsl=false

# Desactiva la gestión predeterminada interna de Kotlin por parte de Flutter si se maneja por plugin
android.builtInKotlin=false

# ─── 5. CONFIGURACIÓN DE EMISIÓN DE RELEASE (AUTOMÁTICO) ───────────────────
flutter.versionName=6.0.1
flutter.versionCode=999999
flutter.buildMode=release